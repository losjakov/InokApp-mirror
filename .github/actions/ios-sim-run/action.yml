name: ios-sim-run
description: cloud_39 (A-127) - THE simulator work of one job (the A-124 ring's walks AND the App Store set, two jobs, one code) - the Debug bundle with the remote hand, the simulator build, scripts/ios_sim_tour.sh, its artifact
inputs:
  runtime: { description: 'oldest | newest', required: true }
  device: { description: 'iphone | iphone63 | ipad', required: true }
  task: { description: 'walk | appstore', required: true }
runs:
  using: composite
  steps:
    - name: The simulator bundle - the remote hand in, localhost allowed (this job only; nothing is committed)
      shell: bash
      run: |
        VITE_SIM_DRIVER=1 npm run build && npx cap sync ios
        /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' ios/App/App/Info.plist 2>/dev/null || true
        /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true' ios/App/App/Info.plist
        python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install -q pillow && echo "PY=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"
    - name: Build for the simulator (Debug, not signed)
      shell: bash
      run: |
        set -o pipefail
        xcodebuild -project "$PROJECT" -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$C" ENABLE_DEBUG_DYLIB=NO OTHER_LDFLAGS='$(inherited) -Wl,-weak_framework,SwiftUICore' build > "$RUNNER_TEMP/sim-build.log" 2>&1 \
          || { grep -E 'error:|warning: .*deprecated' "$RUNNER_TEMP/sim-build.log" | head -40; tail -60 "$RUNNER_TEMP/sim-build.log"; exit 1; }
        tail -3 "$RUNNER_TEMP/sim-build.log"; grep -m1 'GoogleService-Info.plist:' "$RUNNER_TEMP/sim-build.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
        echo "simulator App.app: $(du -sk "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" | cut -f1) KB" | tee -a "$GITHUB_STEP_SUMMARY"
        # cloud_44 (ios 45037644332: iOS 16.4 «dyld: Library not loaded: SwiftUICore … Referenced from App.debug.dylib» - Xcode 26's DEBUG dylib
        # links SwiftUICore, absent before iOS 18). ios 45043064388: the SIMULATOR app links it strongly even without the debug dylib (the device
        # archive does not: «release links SwiftUICore: none») -> here it is WEAK (the ring starts on 16.4; SwiftUI drawing there = NOT-PROVABLE)
        otool -L "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app/App" | grep -i swiftui | sed 's/^/App links: /' | tee -a "$GITHUB_STEP_SUMMARY" || true
    - name: The tour - ${{ inputs.task }} on the ${{ inputs.runtime }} iOS, ${{ inputs.device }}
      shell: bash
      run: |
        set +e   # ios run 1 (cloud_39): under the runner's `bash -e` a missing blank.txt below ended a GREEN set red - only the tour decides
        O="ios-out/${{ inputs.task }}-${{ inputs.runtime }}-${{ inputs.device }}"
        bash scripts/ios_sim_tour.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" "$O" ${{ inputs.runtime }} ${{ inputs.device }} ${{ inputs.task }}; rc=$?
        { echo "### iOS ${{ inputs.task }} ${{ inputs.runtime }} ${{ inputs.device }} (exit $rc)"; grep '^== ' "$O/runtimes.txt"; echo '```'; cat "$O/a3.txt" 2>/dev/null; cat "$O/blank.txt" 2>/dev/null; echo '```';
          cat "$O/sizes.txt" 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
        exit $rc
    - name: iPhone Duo? (T14, the owner 20.11) - the runner's simulator device types, written for the REPORT (no frames from another size, ever)
      if: inputs.task == 'appstore'
      shell: bash
      run: |
        set +e
        O="ios-out/${{ inputs.task }}-${{ inputs.runtime }}-${{ inputs.device }}"; mkdir -p "$O"
        xcrun simctl list devicetypes > "$O/devicetypes.txt" 2>&1
        echo "simulator device types: $(grep -c '(com.apple' "$O/devicetypes.txt") - iPhone Duo: $(grep -i 'duo' "$O/devicetypes.txt" | tr '\n' ';' | sed 's/;$//' | grep . || echo NONE)" | tee -a "$GITHUB_STEP_SUMMARY"
        exit 0
    - name: App Store 04-eparchy / 05-map - the browser half on the LIVE export, joined with this run's marks (cloud_42, A-135; never fails the job)
      if: inputs.task == 'appstore'   # cloud_44 (A-168 (3)): the 6.3-inch iPhone too, at ITS OWN insets (no 6.9-inch frame scaled)
      shell: bash
      run: |
        set +e   # the frames are evidence for CD, never a gate: every outcome is written, the job's verdict stays the tour's
        O="ios-out/${{ inputs.task }}-${{ inputs.runtime }}-${{ inputs.device }}"; D="${{ inputs.device }}"; L="$O/appstore_join.txt"
        [ -f "$O/appstore/insets-$D.json" ] || { echo "LIVE 04/05: SKIPPED - no insets-$D.json from the tour" | tee -a "$L" "$GITHUB_STEP_SUMMARY"; exit 0; }
        # cloud_43 (T14): the LIVE export in place of the sample (this job's checkout only; nothing is committed) = the pair the bundle step
        # already fetched for this build (public/bundled/, sha checked: scripts/bundle_export.mjs - the site with the PUBLIC X-Inok-App key,
        # contract §1; without the key the site answered 403, QUESTIONS cloud_42 5) - one fetch, one source (DRY)
        if [ -s public/bundled/manifest.json ] && cp public/bundled/manifest.json fixtures/manifest.json && cp public/bundled/directory_v1.json.gz.bin fixtures/directory_v1.json.gz; then
          echo "LIVE export: $(python3 -c 'import json;print(json.load(open("fixtures/manifest.json"))["export_version"])')" | tee -a "$L"
        else echo "LIVE 04/05: SKIPPED - no bundled live export in this job (public/bundled/)" | tee -a "$L" "$GITHUB_STEP_SUMMARY"; exit 0; fi
        npx playwright install chromium > /dev/null 2>&1
        INSETS="$O/appstore" APPSTORE_RAW="$O/appstore_raw" npx playwright test -c screens/appstore.config.ts --grep "$D (uk|ru|en)$" > "$O/appstore_frames.txt" 2>&1
        tail -4 "$O/appstore_frames.txt" | tee -a "$L"
        for lang in uk ru en; do for n in 04-eparchy 05-map; do
          raw="$O/appstore_raw/$lang/$D/$n.png"; sim="$O/appstore/$lang/$D/02-home.png"
          if [ -f "$raw" ] && [ -f "$sim" ]; then "$PY" scripts/appstore_join.py "$O/appstore/insets-$D.json" "$raw" "$sim" "$O/appstore/$lang/$D/$n.png" 2>&1 | sed "s|^|$lang $n: |" | tee -a "$L"
          else echo "$lang $n: NOT MADE (browser $( [ -f "$raw" ] && echo ok || echo none ), simulator 02-home $( [ -f "$sim" ] && echo ok || echo none ))" | tee -a "$L"; fi
        done; done
        grep -c '^.. 0[45]-[a-z]*: JOINED' "$L" | sed 's/^/LIVE 04 \/ 05 joined: /' | tee -a "$GITHUB_STEP_SUMMARY"
        exit 0
    - uses: actions/upload-artifact@v7
      if: always()
      with: { name: 'ios-${{ inputs.task }}-${{ inputs.runtime }}-${{ inputs.device }}', path: ios-out/, retention-days: 30, if-no-files-found: ignore }
