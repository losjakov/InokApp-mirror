name: ios
# cloud_36 (A-115 / A-118): the iOS line - ONLY in the public mirror (free macOS runners); in the private home every job is SKIPPED
# (`!github.event.repository.private`, whatever MIRROR_LIVE says: a macOS minute is billed x10 there). Triggers: the mirror's own push /
# a manual run - NEVER pull_request / pull_request_target (a stranger's fork never sees a secret; tests/unit/iosProject.test.ts guards it).
# No secret value is printed; the API key file lives in $RUNNER_TEMP only and is deleted. The tree carries no secret (A-108).
on:
  push:
    branches: [main]
    paths-ignore: # the same docs-only rule as build.yml (A-39)
      - '**/*.md'
      - 'reports/**'
      - 'ref/**'
      - 'store/**'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the signed build to TestFlight (its build number must be new for Apple)'
        type: boolean
        default: false
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: "${{ !contains(github.event.head_commit.message, ': release: v') }}" # a release snapshot's upload is never cancelled
permissions:
  contents: read
env:
  PROJECT: ios/App/App.xcodeproj
jobs:
  # the simulator build + the iPhone / iPad shots (uk, light): the app paints its home, never a white screen
  simulator:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Facts - which repository and event run this
        env: { EXPR_PRIVATE: '${{ github.event.repository.private }}', MIRROR_LIVE: '${{ vars.MIRROR_LIVE }}' }
        run: python3 -I scripts/ci_infra.py facts
      - uses: ./.github/actions/ios-setup
      - name: Build for the simulator (Debug, not signed)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$C" build > "$RUNNER_TEMP/sim-build.log" 2>&1 \
            || { grep -E 'error:|warning: .*deprecated' "$RUNNER_TEMP/sim-build.log" | head -40; tail -60 "$RUNNER_TEMP/sim-build.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/sim-build.log"
          echo "simulator App.app: $(du -sk "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" | cut -f1) KB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: iPhone + iPad simulator - the app paints its home (uk, light)
        run: bash scripts/ios_sim_shots.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" ios-out && cat ios-out/result.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ios-simulator, path: ios-out/, retention-days: 30, if-no-files-found: ignore }

  # the Release archive WITHOUT signing (green whenever the code builds) + the size of the app
  archive:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
      - name: Release archive, NOT signed (+ the size of the app)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$C" archive > "$RUNNER_TEMP/unsigned.log" 2>&1 \
            || { grep -E 'error:' "$RUNNER_TEMP/unsigned.log" | head -40; tail -60 "$RUNNER_TEMP/unsigned.log"; exit 1; }
          A="$RUNNER_TEMP/unsigned.xcarchive/Products/Applications/App.app"
          mkdir -p "$RUNNER_TEMP/p/Payload" && cp -R "$A" "$RUNNER_TEMP/p/Payload/" && (cd "$RUNNER_TEMP/p" && zip -qry ../unsigned.ipa Payload)
          echo "Release App.app (arm64, not signed): $(du -sk "$A" | cut -f1) KB; zipped as an IPA: $(stat -f%z "$RUNNER_TEMP/unsigned.ipa") b" | tee -a "$GITHUB_STEP_SUMMARY"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' -c 'Print :MinimumOSVersion' "$A/Info.plist" | tr '\n' ' ' | sed 's/^/version build minimumOS: /' | tee -a "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"

  # the SIGNED archive by the App Store Connect API key (cloud-managed signing), exported as a signed IPA (proof), or UPLOADED to
  # TestFlight on the release snapshot / a manual run with `upload`. A refusal by Apple is written as it comes (REPORT / QUESTIONS),
  # never worked around - and it never turns the unsigned archive red (its own job).
  testflight:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      UPLOAD: "${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || (github.event_name == 'push' && contains(github.event.head_commit.message, ': release: v')) }}"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
      - name: Upload in this run?
        run: echo "upload to TestFlight in this run - $UPLOAD" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Signing secrets present (names only)
        id: keys
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          miss=""; for n in ASC_API_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do [ -n "${!n}" ] || miss="$miss $n"; done
          if [ -n "$miss" ]; then echo "signed archive: SKIPPED - missing secrets:$miss" | tee -a "$GITHUB_STEP_SUMMARY"; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: SIGNED for the App Store - the archive without a profile, the distribution signature by -exportArchive (cloud signing by the API key)
        if: steps.keys.outputs.ok == '1'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          K="$RUNNER_TEMP/asc_key.p8"
          # the secret holds the .p8 as it is (PEM) or base64 of it - either way the FILE gets the PEM; nothing is printed
          if printf '%s' "$ASC_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$ASC_API_KEY_P8" > "$K"; else printf '%s' "$ASC_API_KEY_P8" | base64 -D > "$K"; fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$K" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          A="$RUNNER_TEMP/App.xcarchive"; COMMON=(-project "$PROJECT" -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$A" MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$C")
          # runs 43743175824 / 43744528943: automatic signing ARCHIVES for development (a registered device is required - the team has none) and
          # refuses «Apple Distribution» with it. So the archive carries no profile: ad-hoc signed WITH the entitlements (they survive the
          # re-signing), else not signed at all; the App Store signature comes from -exportArchive (cloud-managed, no device needed).
          rc=0; HOW=ad-hoc
          xcodebuild "${COMMON[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES archive > "$RUNNER_TEMP/archive.log" 2>&1 || rc=$?
          if [ "$rc" != 0 ]; then
            echo "ad-hoc archive refused: $(grep -m2 'error:' "$RUNNER_TEMP/archive.log" | tr '\n' ' ' | cut -c1-400)" | tee -a "$GITHUB_STEP_SUMMARY"
            rc=0; HOW=unsigned; rm -rf "$A"
            xcodebuild "${COMMON[@]}" CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/archive.log" 2>&1 || rc=$?
          fi
          echo "archive for the App Store: $HOW (exit $rc)" | tee -a "$GITHUB_STEP_SUMMARY"
          export_to() { # $1 = export | upload
            cp ios/ExportOptions.plist "$RUNNER_TEMP/eo.plist"
            plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/eo.plist"
            plutil -replace destination -string "$1" "$RUNNER_TEMP/eo.plist"
            xcodebuild -exportArchive -archivePath "$A" -exportPath "$RUNNER_TEMP/export-$1" -exportOptionsPlist "$RUNNER_TEMP/eo.plist" "${AUTH[@]}" > "$RUNNER_TEMP/export-$1.log" 2>&1
          }
          [ "$rc" = 0 ] && { export_to export || rc=$?; }
          if [ "$rc" = 0 ]; then
            # the App Store signature + the entitlements that must survive it (push, Universal Links), read back from the IPA
            rm -rf "$RUNNER_TEMP/x" && mkdir "$RUNNER_TEMP/x" && unzip -q "$RUNNER_TEMP/export-export/App.ipa" -d "$RUNNER_TEMP/x"
            APP="$RUNNER_TEMP/x/Payload/App.app"
            codesign -dvv "$APP" 2>&1 | grep -E '^Authority=' | head -2 | tee -a "$GITHUB_STEP_SUMMARY"
            codesign -d --entitlements :- "$APP" 2>/dev/null > "$RUNNER_TEMP/ent.plist" || true
            for k in aps-environment com.apple.developer.associated-domains; do
              /usr/libexec/PlistBuddy -c "Print :$k" "$RUNNER_TEMP/ent.plist" > /dev/null 2>&1 && echo "entitlement $k: present" | tee -a "$GITHUB_STEP_SUMMARY" \
                || { echo "::error::entitlement $k LOST in the App Store signature ($HOW archive)"; rc=1; }
            done
            echo "SIGNED IPA: $(stat -f%z "$RUNNER_TEMP/export-export/App.ipa") b" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$rc" = 0 ] && [ "$UPLOAD" = true ]; then export_to upload || rc=$?; [ "$rc" = 0 ] && echo "UPLOADED to App Store Connect: $V ($C) - TestFlight processes it (minutes)" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          rm -f "$K"
          if [ "$rc" != 0 ]; then
            echo "SIGNED: FAILED (exit $rc) - Apple's words:" | tee -a "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP"/archive.log "$RUNNER_TEMP"/export-*.log 2>/dev/null | grep -E 'error:|Error Domain|not allowed|permission|role|requires|No profiles|No Account|IDEDistribution' | sort -u | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
